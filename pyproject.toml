[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-unit-testing-framework"
version = "1.0.0"
description = "Pytest CRUD example with structured test case documentation reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["case(id, input, expected, severity): export this test in case reports"]

[tool.coverage.run]
source = ["qa_crud"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
